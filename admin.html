<!DOCTYPE html>
<html lang="pt-MZ">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <meta name="robots" content="noindex, nofollow">

    <title>Painel — Brasa Grill</title>

    <link rel="stylesheet" href="admin.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

</head>


<body>


    <!-- ==================================================
         ECRÃ DE LOGIN
         ================================================== -->

    <div id="ecraLogin" class="ecra-login">

        <div class="login-caixa">

            <div class="login-topo">

                <i data-lucide="lock"></i>

                <h1>Painel do Restaurante</h1>

                <p>Brasa Grill</p>

            </div>

            <form id="formLogin">

                <label for="passwordInput">
                    Palavra-passe
                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="Introduza a palavra-passe"
                        autocomplete="current-password"
                        required
                    >
                </label>

                <p id="erroLogin" class="erro-login" hidden>
                    ❌ Palavra-passe incorreta
                </p>

                <button type="submit" class="btn-entrar">
                    <i data-lucide="log-in"></i>
                    Entrar
                </button>

            </form>

        </div>

    </div>



    <!-- ==================================================
         ECRÃ DE BOAS-VINDAS (aparece 2 segundos)
         ================================================== -->

    <div id="ecraBoasVindas" class="ecra-boas-vindas" hidden>

        <div class="boas-vindas-caixa">

            <div class="boas-vindas-icone">
                <i data-lucide="check-circle"></i>
            </div>

            <h1 class="boas-vindas-titulo">
                Login efetuado!
            </h1>

            <p class="boas-vindas-sub">
                Bem-vindo de volta,
            </p>

            <p class="boas-vindas-nome" id="boasVindasNome">
                Administrador
            </p>

            <div class="boas-vindas-loader"></div>

        </div>

    </div>



    <!-- ==================================================
         PAINEL (escondido até fazer login)
         ================================================== -->

    <div id="painel" class="painel" hidden>


        <!-- CABEÇALHO -->

        <header class="painel-header">

            <div class="painel-header-info">

                <h1>
                    <i data-lucide="flame"></i>
                    Brasa Grill
                </h1>

                <p id="saudacaoPainel">Painel de pedidos em tempo real</p>

            </div>

            <div class="painel-header-acoes">

                <span id="indicadorLigacao" class="indicador-ligacao">
                    <i data-lucide="wifi"></i>
                    A ligar…
                </span>

                <button id="btnSair" type="button" class="btn-sair">
                    <i data-lucide="log-out"></i>
                    Sair
                </button>

            </div>

        </header>



        <!-- ESTATÍSTICAS -->

        <section class="estatisticas">

            <div class="estat-card" data-filtro="novo">
                <i data-lucide="bell"></i>
                <strong id="contNovo">0</strong>
                <span>Novos</span>
            </div>

            <div class="estat-card" data-filtro="aceite">
                <i data-lucide="check-circle"></i>
                <strong id="contAceite">0</strong>
                <span>Aceites</span>
            </div>

            <div class="estat-card" data-filtro="em_preparacao">
                <i data-lucide="chef-hat"></i>
                <strong id="contPreparacao">0</strong>
                <span>Em preparação</span>
            </div>

            <div class="estat-card" data-filtro="pronto">
                <i data-lucide="package"></i>
                <strong id="contPronto">0</strong>
                <span>Prontos</span>
            </div>

            <div class="estat-card" data-filtro="entregue">
                <i data-lucide="check-check"></i>
                <strong id="contEntregue">0</strong>
                <span>Entregues</span>
            </div>

        </section>



        <!-- FILTROS -->

        <section class="filtros">

            <button type="button" class="btn-filtro ativo" data-filtro="todos">
                Todos
            </button>

            <button type="button" class="btn-filtro" data-filtro="novo">
                Novos
            </button>

            <button type="button" class="btn-filtro" data-filtro="aceite">
                Aceites
            </button>

            <button type="button" class="btn-filtro" data-filtro="em_preparacao">
                Em preparação
            </button>

            <button type="button" class="btn-filtro" data-filtro="pronto">
                Prontos
            </button>

            <button type="button" class="btn-filtro" data-filtro="entregue">
                Entregues
            </button>

            <button type="button" class="btn-filtro" data-filtro="recusado">
                Recusados
            </button>

        </section>



        <!-- LISTA DE PEDIDOS -->

        <section id="listaPedidos" class="lista-pedidos">

            <div class="sem-pedidos">
                <i data-lucide="inbox"></i>
                <p>A carregar pedidos…</p>
            </div>

        </section>


    </div>



    <!-- ==================================================
         FIREBASE SDK
         ================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>
    <script src="pedidos.js"></script>
    <script src="admin.js"></script>


</body>

</html>
